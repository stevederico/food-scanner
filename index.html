<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/icons/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- OpenGraph Meta Data -->
    <meta property="og:title" content="{{APP_NAME}}">
    <meta property="og:description" content="{{TAGLINE}}">
    <meta property="og:image" content="/icons/icon.png">
    <meta property="og:url" content="https://{{COMPANY_WEBSITE}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{APP_NAME}}">

    <!-- Twitter Card Meta Data -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{APP_NAME}}">
    <meta name="twitter:description" content="{{TAGLINE}}">
    <meta name="twitter:image" content="/icons/icon.png">

    <!-- Analytics -->
    <script defer src="https://aob.bixbyapps.com/script.js" data-website-id="3792ef0e-c836-41f1-9acc-be2d291c50dc" data-domains="food.bixbyapps.com"></script>

    <!-- dottie-analytics — parallel with Umami during migration -->
    <script defer src="https://api.dottie.ai/script.js" data-website-id="3e4dc894a2a9a67b8dbcb13510a5029f" data-domains="food.bixbyapps.com"></script>

    <!-- Prevent dark mode flash (classic script: blocks parse, CSP 'self' only). -->
    <script src="/theme-init.js"></script>

    <!-- Paint the theme background before the stylesheet resolves; no opacity gate, so a
         failed CSS load degrades to unstyled content instead of a blank page. -->
    <style>
      body { background: oklch(0.985 0 0); height: 100%; overscroll-behavior: none; }
      .dark body { background: oklch(0.05 0 0); }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
